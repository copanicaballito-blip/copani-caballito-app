<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Copani Caballito · Gastos</title>
  <meta name="theme-color" content="#6D4C41">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Copani">
  <link rel="apple-touch-icon" href="icono-180.png">
  <link rel="icon" type="image/png" href="icono-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <header class="barra">
    <h1>Copani Caballito <small>Gastos</small></h1>
    <div class="barra-botones">
      <button id="btn-buscar" class="icono" aria-label="Buscar gastos" aria-expanded="false" hidden>
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>
      </button>
      <button id="btn-reportes" class="icono" aria-label="Reportes mensuales (Excel)" hidden>
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="2"/><path d="M3.5 9.5h17M3.5 15h17M10 9.5v11"/></svg>
      </button>
      <button id="btn-salir" class="texto" hidden>Salir</button>
    </div>
  </header>

  <div id="aviso-demo" class="aviso-demo" hidden>
    Modo demo: los datos son de ejemplo y quedan solo en este navegador.
  </div>

  <div id="aviso-reglas" class="aviso-demo aviso-error" role="alert" hidden></div>

  <!-- Búsqueda (lupa): queda fuera de #contenido para no perder el foco mientras se escribe -->
  <div id="buscador" class="buscador" role="search" hidden>
    <input id="buscar" type="search" placeholder="Buscar por descripción, rubro, monto…" autocomplete="off" enterkeyhint="search" aria-label="Buscar gastos">
    <select id="sel-rubro" aria-label="Filtrar por rubro"></select>
  </div>

  <main id="contenido"></main>

  <button id="btn-nuevo" class="fab" hidden>+ Nuevo gasto</button>
  <div id="toast" class="toast" role="status" hidden></div>

  <!-- Detalle de un gasto: cambiar estado y registrar pagos parciales -->
  <dialog id="dlg-detalle">
    <div id="detalle-cuerpo" class="dlg-cuerpo"></div>
  </dialog>

  <!-- Reportes mensuales (Excel) -->
  <dialog id="dlg-reportes">
    <div id="reportes-cuerpo" class="dlg-cuerpo"></div>
  </dialog>

  <!-- Alta y edición de un gasto -->
  <dialog id="dlg-form">
    <form id="form-gasto" class="dlg-cuerpo" novalidate>
      <h2 id="form-titulo">Nuevo gasto</h2>
      <label>Descripción
        <input name="descripcion" maxlength="120" autocomplete="off" required>
      </label>
      <label>Monto ($)
        <input name="monto" inputmode="numeric" autocomplete="off" placeholder="Ej. 150000" required>
      </label>
      <label>Fecha de pago
        <input name="fechaPago" type="date" required>
      </label>
      <label>Rubro
        <select name="rubro"></select>
      </label>
      <label>Forma de pago
        <select name="formaPago"></select>
      </label>
      <fieldset class="estados">
        <legend>Estado</legend>
        <label class="opcion estado-estimado"><input type="radio" name="estado" value="estimado"><span>Estimado</span></label>
        <label class="opcion estado-a_pagar"><input type="radio" name="estado" value="a_pagar"><span>A pagar</span></label>
        <label class="opcion estado-pagado"><input type="radio" name="estado" value="pagado"><span>Pagado</span></label>
      </fieldset>
      <label class="check"><input type="checkbox" name="recurrente"><span>Se repite todos los meses</span></label>
      <p id="nota-recurrente" class="nota" hidden>Este gasto ya se repite todos los meses. Los cambios valen para este mes y los siguientes; los meses anteriores no cambian.</p>
      <p id="error-gasto" class="error" role="alert"></p>
      <div class="acciones">
        <button type="button" id="form-cancelar">Cancelar</button>
        <button class="primario">Guardar</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
