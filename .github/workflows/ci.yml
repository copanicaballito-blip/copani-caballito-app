name: CI

on:
  push:
    paths-ignore:
      - "**/*.md"
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Reglas de la app (estados, saldos, pagos parciales). No hay dependencias que instalar.
      - run: npm test
