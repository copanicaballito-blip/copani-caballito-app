name: CI

on:
  push:
    paths-ignore:
      - "**/*.md"
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # La app no tiene dependencias; solo el programa de mails (automatizacion/) usa `nodemailer`,
      # y `node --test` también corre sus pruebas.
      - run: npm ci --prefix automatizacion
      # Reglas de la app (estados, saldos, pagos parciales) y programa de mails.
      - run: npm test
